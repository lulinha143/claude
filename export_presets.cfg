; HEAVY BAGGAGE export presets.
; NOTE: exporting requires the matching Godot 4.4 export templates installed
; (see docs/BUILD_GUIDE.md). These presets contain no secrets. A "steam" build
; is produced by adding the `steam` custom feature once GodotSteam is vendored.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="steam_appid.txt, *.md"
export_path="build/windows/HeavyBaggage.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
application/product_name="HEAVY BAGGAGE"
application/company_name="Heavy Baggage Studio"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="steam_appid.txt, *.md"
export_path="build/linux/HeavyBaggage.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=true

[preset.2]

name="Demo (Windows)"
platform="Windows Desktop"
